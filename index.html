<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maze Standoff</title>
    <meta
      name="description"
      content="A top-down maze tank battle. Steer with the arrow keys or WASD, fire with click or space."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Maze Standoff</h1>
      <div class="game-wrap">
        <canvas id="game" width="960" height="600" aria-label="Maze Standoff game canvas"></canvas>
        <div class="hud" aria-live="polite">
          <div class="lives" id="lives"></div>
          <div class="kills" id="kills"></div>
        </div>
        <div class="end-screen" id="endScreen" hidden>
          <p id="endMessage"></p>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
